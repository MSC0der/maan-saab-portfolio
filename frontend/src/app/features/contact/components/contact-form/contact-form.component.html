<section class="contact-form-card">
  <h2>Technical Inquiry</h2>

  <form>
    <div class="form-grid">
      <div class="field">
        <label>Name</label>
        <input type="text" placeholder="John Doe" />
      </div>

      <div class="field">
        <label>Email</label>
        <input type="email" placeholder="john@company.com" />
      </div>

      <div class="field">
        <label>Company</label>
        <input type="text" placeholder="Engineering Corp" />
      </div>

      <div class="field">
        <label>Project Type</label>

        <select>
          <option>Software Engineer Role</option>
          <option>Full Stack Development</option>
          <option>Backend Architecture</option>
          <option>Technical Consulting</option>
        </select>
      </div>

      <div class="field field--full">
        <label>Budget (Optional)</label>

        <input type="text" placeholder="e.g. $5k - $10k" />
      </div>

      <div class="field field--full">
        <label>Message</label>

        <textarea
          rows="6"
          placeholder="Tell me about your technical challenges..."
        ></textarea>
      </div>

      <div class="field field--full">
        <button type="submit">Send Message</button>
      </div>
    </div>
  </form>
</section>
