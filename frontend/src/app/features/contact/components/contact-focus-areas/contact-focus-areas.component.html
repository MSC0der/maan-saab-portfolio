<section class="focus-areas">
  <h2>
    {{ config.focusAreas.title }}
  </h2>

  <div class="focus-grid">
    @for (area of config.focusAreas.areas; track area.title) {
      <article class="focus-card">
        <span class="focus-card__number">
          {{ area.number }}
        </span>

        <h3>
          {{ area.title }}
        </h3>
      </article>
    }
  </div>
</section>
