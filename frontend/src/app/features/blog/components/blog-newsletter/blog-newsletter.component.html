<section class="newsletter">
  <h2>
    {{ config.newsletter.title }}
  </h2>

  <p>
    {{ config.newsletter.description }}
  </p>

  <div class="newsletter-form">
    <a
      class="newsletter-form__link"
      [href]="followUrl"
      target="_blank"
      rel="noopener noreferrer"
    >
      {{ config.newsletter.buttonLabel }}
    </a>
  </div>
</section>
