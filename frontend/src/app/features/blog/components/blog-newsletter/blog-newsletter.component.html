<section class="newsletter">
  <h2>
    {{ config.newsletter.title }}
  </h2>

  <p>
    {{ config.newsletter.description }}
  </p>

  <form class="newsletter-form">
    <input type="email" [placeholder]="config.newsletter.placeholder" />

    <button type="button">
      {{ config.newsletter.buttonLabel }}
    </button>
  </form>
</section>
