<section class="blog-hero">
  <span class="blog-hero__eyebrow">
    {{ config.hero.eyebrow }}
  </span>

  <h1>
    {{ config.hero.title }}
  </h1>

  <p>
    {{ config.hero.description }}
  </p>

  <div class="blog-hero__stats">
    @for (stat of config.hero.stats; track stat.label) {
      <div>
        <strong>
          {{ stat.value }}
        </strong>

        <span>
          {{ stat.label }}
        </span>
      </div>
    }
  </div>
</section>
