<section class="filter-bar" role="group" aria-label="Filter articles by topic">
  @for (chip of chips(); track chip.topic) {
    <button
      type="button"
      class="filter-chip"
      [class.filter-chip--active]="chip.topic === selected()"
      [attr.aria-pressed]="chip.topic === selected()"
      (click)="select(chip.topic)"
    >
      {{ chip.label }}
    </button>
  }
</section>
