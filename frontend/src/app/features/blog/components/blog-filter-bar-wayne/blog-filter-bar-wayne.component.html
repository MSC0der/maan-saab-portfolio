<section class="wayne-filter-bar" role="group" aria-label="Filter dossiers by topic">
  @for (chip of chips(); track chip.topic) {
    <button
      type="button"
      class="wayne-filter-chip"
      [class.wayne-filter-chip--active]="chip.topic === selected()"
      [attr.aria-pressed]="chip.topic === selected()"
      (click)="select(chip.topic)"
    >
      {{ chip.label }}
    </button>
  }
</section>
