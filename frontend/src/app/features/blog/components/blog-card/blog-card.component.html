<article class="blog-card">
  <div class="blog-card__meta">
    <span class="blog-card__category">
      {{ article().category }}
    </span>

    <span>
      {{ article().readTime }}
    </span>
  </div>

  <h3>
    {{ article().title }}
  </h3>

  <p>
    {{ article().excerpt }}
  </p>

  <div class="blog-card__footer">
    <span>
      {{ article().publishedAt }}
    </span>

    <a [routerLink]="['/blog', article().slug]"> Read More → </a>
  </div>
</article>
