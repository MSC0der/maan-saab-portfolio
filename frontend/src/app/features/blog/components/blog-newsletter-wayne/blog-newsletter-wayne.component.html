<section class="wayne-newsletter">
  <div class="wayne-newsletter__icon">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="6" cy="18" r="1.7" />

      <path d="M5 11a8 8 0 0 1 8 8" />

      <path d="M5 5a14 14 0 0 1 14 14" />
    </svg>
  </div>

  <span class="wayne-newsletter__eyebrow">
    {{ config.articleNewsletter.eyebrow }}
  </span>

  <h2>
    {{ config.articleNewsletter.title }}
  </h2>

  <p>
    {{ config.articleNewsletter.description }}
  </p>

  <div class="wayne-newsletter__form">
    <a
      class="wayne-newsletter__link"
      [href]="followUrl"
      target="_blank"
      rel="noopener noreferrer"
    >
      {{ config.articleNewsletter.buttonLabel }}
    </a>
  </div>

</section>
