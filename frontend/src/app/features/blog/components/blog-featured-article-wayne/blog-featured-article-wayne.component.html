<section class="wayne-featured">
  <div class="wayne-featured__label">
    <span class="wayne-featured__line"></span>

    {{ config.featuredArticle.label }}
  </div>

  <article class="wayne-featured-card">
    <div class="wayne-featured-image">
      <img
        src="images/blog/jwt-rbac-wayne.webp"
        alt="JWT Authentication Architecture"
      />
    </div>

    <div class="wayne-featured-content">
      <div class="wayne-meta">
        <span class="wayne-category">{{ article.category }}</span>

        <span>{{ article.readTime }}</span>

        <span>{{ article.publishedAt }}</span>
      </div>

      <h2>{{ article.title }}</h2>

      <p>{{ article.excerpt }}</p>

      <div class="wayne-buttons">
        <a class="primary" [routerLink]="['/blog', article.slug]">
          {{ config.featuredArticle.primaryButton }}
        </a>

        <a class="secondary" routerLink="/blog" fragment="articles">
          {{ config.featuredArticle.secondaryButton }}
        </a>
      </div>
    </div>
  </article>
</section>
