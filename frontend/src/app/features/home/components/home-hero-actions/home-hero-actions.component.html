<div class="hero-actions animate-on-load">
  <a class="home-button home-button--primary" routerLink="/projects">
    {{ config.heroActions.primary }}
  </a>

  <button
    type="button"
    class="home-button home-button--secondary"
    [disabled]="isResumeDownloading()"
    [attr.aria-busy]="isResumeDownloading()"
    (click)="onResumeClick()"
  >
    {{ isResumeDownloading() ? 'Preparing…' : config.heroActions.secondary }}
  </button>

  <a class="home-button home-button--ghost" routerLink="/contact">
    {{ config.heroActions.ghost }}
  </a>
</div>
