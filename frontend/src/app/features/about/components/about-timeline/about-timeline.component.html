<section class="timeline-section">
  <div class="timeline-section__header">
    <h2>Engineering Journey</h2>
    <p>The path from student developer to backend-focused software engineer.</p>
  </div>

  <div class="timeline">
    <div class="timeline__base-line" aria-hidden="true"></div>
    <div class="timeline__progress-line" aria-hidden="true"></div>

    <div class="timeline__items">
      @for (item of timeline; track item.year; let index = $index) {
        <article
          class="timeline-item"
          [class.timeline-item--reverse]="index % 2 === 1"
        >
          <div class="timeline-item__year timeline-item__year--desktop">
            <span [class.timeline-item__badge--future]="item.future">{{
              item.year
            }}</span>
          </div>

          <span
            class="timeline-item__dot"
            [class.timeline-item__dot--future]="item.future"
            aria-hidden="true"
          ></span>

          <div class="timeline-item__year timeline-item__year--mobile">
            <span [class.timeline-item__badge--future]="item.future">{{
              item.year
            }}</span>
          </div>

          <div class="timeline-item__content">
            <div
              class="timeline-card"
              [class.timeline-card--future]="item.future"
            >
              <div class="timeline-card__glow" aria-hidden="true"></div>
              <h3>{{ item.title }}</h3>
              <p>{{ item.description }}</p>
            </div>
          </div>
        </article>
      }
    </div>
  </div>
</section>
