<section class="wayne-capabilities">
  <div class="wayne-section-header">
    <h2>Capabilities Matrix</h2>

    <span class="wayne-section-header__line"></span>

    <span class="wayne-section-header__meta"> ENGINEERING_SCHEMATIC_v4.2 </span>
  </div>

  <div class="wayne-capabilities-grid">
    @for (capability of capabilities; track capability.title) {
      <article class="wayne-capability-card">
        <h3>{{ capability.title }}</h3>

        <div class="wayne-capability-card__stats">
          <span>{{ capability.technology }}</span>

          <span>{{ capability.percentage }}%</span>
        </div>

        <div class="wayne-capability-card__progress">
          <span
            class="wayne-capability-card__fill"
            [style.width.%]="capability.percentage"
          ></span>
        </div>

        <p>
          {{ capability.details }}
        </p>
      </article>
    }
  </div>
</section>
