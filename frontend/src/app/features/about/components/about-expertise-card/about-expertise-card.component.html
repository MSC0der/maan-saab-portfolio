<article class="expertise-card">
  <div class="expertise-card__media">
    <img [src]="imageUrl()" [alt]="imageAlt()" />
  </div>

  <div class="expertise-card__body">
    <h3>{{ title() }}</h3>

    <div class="expertise-card__chips">
      @for (skill of skills(); track skill) {
        <span>{{ skill }}</span>
      }
    </div>
  </div>
</article>
