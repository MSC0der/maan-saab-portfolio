<section class="project-system-flow">
  <div class="project-system-flow__header">
    <h2>End-to-End System Flow</h2>

    <p>
      Mapping the request lifecycle from the frontend through the security
      perimeter and business logic layer into persistent storage.
    </p>
  </div>

  <div class="flow-grid">
    @for (step of project().architecture; track step) {
      <article class="flow-card">
        <div class="flow-card__number">
          {{ $index + 1 }}
        </div>

        <h3>
          {{ step }}
        </h3>
      </article>
    }
  </div>
</section>
