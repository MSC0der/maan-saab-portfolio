<section class="project-system-flow">
  <div class="project-system-flow__header">
    <h2>End-to-End System Flow</h2>

    <p>
      Mapping the request lifecycle from the frontend through the security
      perimeter and business logic layer into persistent storage.
    </p>
  </div>

  <div class="project-system-flow__diagram">
    @for (step of project().architecture; track step; let last = $last) {
      <div class="flow-node">
        <div class="flow-node__icon">
          {{ $index + 1 }}
        </div>

        <div class="flow-node__content">
          <h3>
            {{ step }}
          </h3>
        </div>
      </div>

      @if (!last) {
        <div class="flow-arrow">→</div>
      }
    }
  </div>
</section>
