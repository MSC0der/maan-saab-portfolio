<section class="project-system-flow">
  <div class="project-system-flow__header">
    <h2>System Architecture Flow</h2>

    <p>
      End-to-end request journey through the platform architecture,
      demonstrating how data flows across application layers.
    </p>
  </div>

  <div class="architecture-flow">
    @for (step of project().architecture; track step; let last = $last) {
      <article class="architecture-node">
        <div class="architecture-node__number">
          {{ $index + 1 }}
        </div>

        <h3>
          {{ step }}
        </h3>
      </article>

      @if (!last) {
        <div class="architecture-flow__connector">→</div>
      }
    }
  </div>
</section>
