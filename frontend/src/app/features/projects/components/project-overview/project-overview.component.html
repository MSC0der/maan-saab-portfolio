<section class="project-overview">
  <div class="project-overview__left">
    <div class="project-overview__section-label">Project Context</div>

    <article class="project-overview__panel">
      <h3>Business Problem</h3>

      <p>
        {{ project().businessProblem }}
      </p>
    </article>

    <article class="project-overview__panel">
      <h3>Technical Goals</h3>

      <p>
        {{ project().technicalGoals }}
      </p>
    </article>
  </div>

  <div class="project-overview__right">
    <div class="project-overview__section-label">Project Ownership</div>

    <article class="project-overview__panel">
      <h3>
        {{ project().role }}
      </h3>

      <p>
        {{ project().roleDescription }}
      </p>

      <div class="project-overview__stats">
        <div class="project-overview__stat">
          <span>Duration</span>

          <strong>
            {{ project().duration }}
          </strong>
        </div>

        <div class="project-overview__stat">
          <span>Team Size</span>

          <strong>
            {{ project().teamSize }}
          </strong>
        </div>
      </div>
    </article>
  </div>
</section>
