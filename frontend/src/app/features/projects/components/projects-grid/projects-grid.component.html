<section class="projects-grid" id="projects-grid">
  @for (project of projects(); track project.slug) {
    <div
      class="projects-grid__item"
      [class.projects-grid__item--featured]="project.featured"
      [class.projects-grid__item--full-width]="
        project.slug === 'event-booking-platform'
      "
    >
      <app-project-card [project]="project" />
    </div>
  }
</section>
