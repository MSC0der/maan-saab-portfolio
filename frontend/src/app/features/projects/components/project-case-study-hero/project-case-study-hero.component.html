<section class="case-study-hero">
  <div class="case-study-hero__content">
    <div class="case-study-hero__text">
      <div class="case-study-hero__badge">
        Case Study · {{ project().category }}
      </div>

      <h1>
        {{ project().title }}
      </h1>

      <p class="case-study-hero__summary">
        {{ project().summary }}
      </p>

      <div class="case-study-hero__stack">
        @for (technology of project().technologies; track technology) {
          <span>
            {{ technology }}
          </span>
        }
      </div>

      <div class="case-study-hero__actions">
        <a href="#" class="case-study-hero__primary"> View Source </a>

        <a href="#" class="case-study-hero__secondary"> Live Demo </a>
      </div>
    </div>

    <div class="case-study-hero__diagram">
      <div class="architecture-card">
        @for (step of project().architecture; track step) {
          <div class="architecture-card__node">
            {{ step }}
          </div>
        }
      </div>
    </div>
  </div>
</section>
