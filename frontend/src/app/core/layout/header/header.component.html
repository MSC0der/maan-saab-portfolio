<header class="site-header">
  <div class="site-header__inner">
    <a class="site-header__brand" [routerLink]="['/']" [attr.aria-label]="site.brandName + ' home'">
      <span class="site-header__brand-name">{{ themeConfig.brandName }}</span>
    </a>

    <nav class="site-header__nav" aria-label="Primary navigation">
      @for (item of navigation; track item.path) {
        @if (item.fragmentOnly) {
          <a class="site-header__nav-link" [href]="item.path">{{ item.label }}</a>
        } @else {
          <a
            class="site-header__nav-link"
            [routerLink]="item.path"
            routerLinkActive="site-header__nav-link--active"
            [routerLinkActiveOptions]="{ exact: item.exact }"
          >
            {{ item.label }}
          </a>
        }
      }
    </nav>

    <button
      type="button"
      class="site-header__resume"
      [disabled]="isResumeDownloading()"
      [attr.aria-busy]="isResumeDownloading()"
      (click)="onResumeClick()"
    >
      {{ isResumeDownloading() ? 'Preparing…' : themeConfig.resumeLabel }}
    </button>
  </div>
</header>
